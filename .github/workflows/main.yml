name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Build IPA
      run: |
        ls -la
        mkdir -p build/Payload
        # 复制整个 ios_antiscreen 目录
        cp -R ios_antiscreen/* build/
        cd build
        # 打包整个目录为 zip，然后重命名为 ipa
        zip -qr Antiscreen.ipa Antiscreen.xcodeproj Antiscreen/
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Antiscreen-IPA
        path: build/Antiscreen.ipa
        retention-days: 7
