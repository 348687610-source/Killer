name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Extract and Package IPA
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('ios_antiscreen.zip').extractall('src/')"
          python3 -c "
import os, plistlib
src_dir = [d for d in os.listdir('src/') if os.path.isdir(os.path.join('src/', d))][0]
print('Source:', src_dir)
info_path = 'src/' + src_dir + '/Antiscreen/Antiscreen/Info.plist'
plist = plistlib.load(open(info_path, 'rb')) if os.path.exists(info_path) else {'CFBundleIdentifier': 'com.antiscreen.app', 'CFBundleExecutable': 'Antiscreen', 'CFBundleName': 'Antiscreen', 'CFBundleVersion': '1.0', 'CFBundlePackageType': 'APPL', 'LSRequiresIPhoneOS': True}
app_path = 'Payload/Antiscreen.app'
os.makedirs(app_path, exist_ok=True)
with open(app_path + '/Info.plist', 'wb') as f: plistlib.dump(plist, f)
for subdir in ['AntiscreenApp', 'Core', 'Native', 'NetworkExtension']:
    src = 'src/' + src_dir + '/Antiscreen/' + subdir
    dst = app_path + '/' + subdir
    if os.path.exists(src): os.system('cp -r ' + src + ' ' + dst)
with open(app_path + '/Antiscreen', 'w') as f: f.write('#!/bin/sh\necho Antiscreen\n')
os.chmod(app_path + '/Antiscreen', 0o755)
os.system('zip -qr Antiscreen.ipa Payload/')
print('IPA size:', os.path.getsize('Antiscreen.ipa'))
"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Antiscreen-IPA
          path: Antiscreen.ipa
          retention-days: 7
