name名称: Build iOS IPA构建 iOS IPA
on:
  workflow_dispatch: workflow_dispatch:
jobs:作业:
  build:  构建:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4      - 使用: actions/checkout@v4
      - name: Setup Xcode      - 名称: 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1        使用: maxim-lobanov/setup-xcode@v1
        with        使用:
          xcode-version: '15.0'          Xcode 版本: '15.0'
      - name: Extract and Build      - 名称: 提取并构建
        run: |        运行: |
          python3 -c "import zipfile, os; zipfile.ZipFile('ios_antiscreen.zip','r').extractall('src/')"
          ls -la src/
      - name: Package IPA      - name: 打包 IPA
        run: |        运行: |
          cd src/ios_antiscreen
          mkdir -p Antiscreen.app
          cp -r Antiscreen/Antiscreen/* Antiscreen.app/ 2>/dev/null || true
          cp Antiscreen/Antiscreen/Info.plist Antiscreen.app/ 2>/dev/null || true
          mkdir -p ../../Payload
          cp -r Antiscreen.app ../../Payload/
          cd ../.. && zip -qr Antiscreen.ipa Payload/
          ls -la Antiscreen.ipa
      - name: Upload IPA      - 名称: 上传 IPA
        uses: actions/upload-artifact@v4        使用: actions/upload-artifact@v4
        with:        附带:
          name: Antiscreen-IPA          名称: Antiscreen-IPA          名称: ntiscreen-IPA          名称: Antiscreen-IPA
          path: A          路径: ntiscreen.ipa          路径: Antiscreen.ipa
          retention-days: 7
