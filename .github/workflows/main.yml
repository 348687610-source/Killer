    - name: Extract and Build
      run: |
        python3 -c "import zipfile, os; zipfile.ZipFile('ios_antiscreen.zip','r').extractall('src/')"
        cd src/ios_antiscreen
        # 创建 App bundle 目录结构
        mkdir -p Antiscreen.app
        # 复制资源文件
        cp -r Antiscreen/Antiscreen/* Antiscreen.app/ 2>/dev/null || true
        cp Antiscreen/Antiscreen/Info.plist Antiscreen.app/
        cp Antiscreen/Antiscreen/Antiscreen.entitlements Antiscreen.app/embedded.mobileprovision 2>/dev/null || true
        # 回到根目录，创建 Payload
        cd ../..
        mkdir -p Payload
        cp -r src/ios_antiscreen/Antiscreen.app Payload/
        # 打包 IPA
        zip -qr Antiscreen.ipa Payload/
        # 验证结构
        ls -la Payload/
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Antiscreen-IPA
        path: Antiscreen.ipa
