name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'
      - name: Extract
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('ios_antiscreen.zip').extractall('src/')"
          ls -la src/
      - name: Package IPA
        run: |
          cd src
          DIR=$(ls -d */ | head -n 1)
          cd "$DIR"
          mkdir -p Antiscreen.app
          cp -r Antiscreen/Antiscreen/* Antiscreen.app/ 2>/dev/null || true
          cp Antiscreen/Antiscreen/Info.plist Antiscreen.app/ 2>/dev/null || true
          mkdir -p ../../Payload
          cp -r Antiscreen.app ../../Payload/
          cd ../.. && zip -qr Antiscreen.ipa Payload/
          ls -la Antiscreen.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Antiscreen-IPA
          path: Antiscreen.ipa
          retention-days: 7
