    - name: Extract and Build
      run: |
        # 用 Python 处理 Windows 风格的 zip
        python3 -c "
import zipfile, os
with zipfile.ZipFile('ios_antiscreen.zip', 'r') as z:
            z.extractall('extracted/')
print('Extracted:', os.listdir('extracted/'))
"
        ls -la extracted/
        cd extracted/ios_antiscreen 2>/dev/null || cd extracted
        xcodebuild -project Antiscreen.xcodeproj \
          -scheme Antiscreen \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/Antiscreen.app Payload/
        cd .. && zip -qr Antiscreen.ipa Payload/
