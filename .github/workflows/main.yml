  name名称: Build iOS IPA构建 iOS IPA
on开启:
  workflow_dispatch: workflow_dispatch:
jobs:作业:
  build:  构建:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4    - 使用: actions/checkout@v4
    - name: Setup Xcode    - 名称: 设置 Xcode
      uses: maxim-lobanov/setup-xcode@v1      使用: maxim-lobanov/setup-xcode@v1
      with:      与:
        xcode-version: '15.0'
    - name: Extract and Build    - 名称: 提取与构建
      run: |
        python3 -c "
import zipfile, os
with zipfile.ZipFile('ios_antiscreen.zip', 'r') as z:使用 zipfile.ZipFile('ios_antiscreen.zip', 'r') 作为 z:
    z.extractall('extracted/')
print('Extracted:', os.listdir('extracted/'))print('已提取：', os.listdir('extracted/'))
"
        ls -la extracted/
        cd extracted/ios_antiscreen 2>/dev/null || cd extracted
        xcodebuild -project Antiscreen.xcodeproj \
          -scheme Antiscreen \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/Antiscreen.app Payload/
        cd .. && zip -qr Antiscreen.ipa Payload/
    - name: Upload IPA    - 名称: 上传 IPA
      uses: actions/upload-artifact@v4      使用: actions/upload-artifact@v4
      with:      与:
        name: Antiscreen-IPA        名称: Antiscreen-IPA
        path: extracted/Antiscreen.ipa
        retention-days: 7        保留天数: 7
